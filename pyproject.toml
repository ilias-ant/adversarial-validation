[project]
name = "advertion"
version = "1.0.1"
description = "A tiny framework to perform adversarial validation of your training and test data."
authors = [{ name = "Ilias Antonopoulos", email = "ilias.antonopoulos@yahoo.gr" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
keywords = ["adversarial-validation", "data-drift", "machine-learning"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "numpy>=1.24,<3",
    "pandas>=2.0,<4",
    "pydantic>=2.0,<3",
    "scikit-learn>=1.3,<2",
    "scipy>=1.10,<2",
    "xgboost>=1.7,<4",
]

[project.urls]
Homepage = "https://pypi.org/project/advertion"
Repository = "https://github.com/ilias-ant/adversarial-validation"
Documentation = "https://advertion.readthedocs.io"
"Bug Tracker" = "https://github.com/ilias-ant/adversarial-validation/issues"

[tool.poetry]
requires-poetry = ">=2.0"

[tool.poetry.group.dev.dependencies]
autoflake = "^2.4.0"
bandit = "^1.9.4"
black = "^26.10.1"
isort = "^9.0.2"
pytest = "^9.2.0"
pytest-cov = "^7.1.0"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.6.1"
mkdocs-material = "^9.8.1"
mkdocstrings = { version = "^1.0.8", extras = ["python"] }

[tool.black]
line-length = 88
skip-string-normalization = true
target-version = ['py311', 'py312', 'py313', 'py314']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | \.pytest_cache
  | \.test_coverage
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = []

[build-system]
requires = ["poetry-core>=2.0,<3"]
build-backend = "poetry.core.masonry.api"
